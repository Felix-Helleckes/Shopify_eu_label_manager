# Shopify app configuration – EU Compliance Suite
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
# `shopify app dev` rewrites application_url / redirect_urls / app_proxy.url for the tunnel.

client_id = "6860ad69a983c0549dc759de3b0a5cb0"
name = "EU Compliance Suite"
application_url = "https://eu-compliance-suite.netlify.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# read/write_orders: match withdrawals to orders and tag them.
# write_products: create the product metafield definitions for the durability label.
scopes = "read_orders,write_orders,write_products"

[auth]
redirect_urls = [
  "https://eu-compliance-suite.netlify.app/auth/callback",
  "https://eu-compliance-suite.netlify.app/auth/shopify/callback",
  "https://eu-compliance-suite.netlify.app/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for public apps
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

# Storefront -> app:  https://<shop>/apps/eu-compliance/<path>  =>  <application_url>/proxy/<path>
[app_proxy]
url = "https://eu-compliance-suite.netlify.app/proxy"
subpath = "eu-compliance"
prefix = "apps"

[pos]
embedded = false
