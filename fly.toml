# Fly.io configuration – EU Compliance Suite
# First deploy:  fly launch --copy-config --no-deploy && fly volumes create app_data -r fra -n 1 -s 1
# Secrets:       fly secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... SHOPIFY_APP_URL=https://<app>.fly.dev SCOPES=read_orders,write_orders,write_products SMTP_HOST=... SMTP_USER=... SMTP_PASS=... MAIL_FROM=... IP_HASH_SECRET=...
app = "eu-compliance-suite"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/data/prod.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm: webhooks and the storefront proxy must answer quickly.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthcheck"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "app_data"
  destination = "/data"
