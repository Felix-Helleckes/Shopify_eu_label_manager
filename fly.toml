# Fly.io configuration – EU Compliance Suite
#
# Setup (once):
#   fly auth login
#   fly apps create eu-compliance-suite --org personal
#   ./scripts/fly-secrets.sh          # reads .env / .env.netlify and pushes the secrets
#   fly deploy
#
# The database is Supabase (eu-central-1, Frankfurt) and the app runs in fra, so both storage
# and processing stay inside the EU. Verify at /healthcheck → host.region.

app = "eu-compliance-suite"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Never scale to zero: Shopify webhooks and the storefront withdrawal proxy must answer immediately.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthcheck"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
