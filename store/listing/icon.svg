    <use href="#star" transform="rotate(30) translate(0,-470)"/>
    <use href="#star" transform="rotate(60) translate(0,-470)"/>
    <use href="#star" transform="rotate(90) translate(0,-470)"/>
    <use href="#star" transform="rotate(120) translate(0,-470)"/>
    <use href="#star" transform="rotate(150) translate(0,-470)"/>
    <use href="#star" transform="rotate(180) translate(0,-470)"/>
    <use href="#star" transform="rotate(210) translate(0,-470)"/>
    <use href="#star" transform="rotate(240) translate(0,-470)"/>
    <use href="#star" transform="rotate(270) translate(0,-470)"/>
    <use href="#star" transform="rotate(300) translate(0,-470)"/>
    <use href="#star" transform="rotate(330) translate(0,-470)"/>
