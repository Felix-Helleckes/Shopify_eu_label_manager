<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <g id="star"><polygon points="0,-30 9,-9 31,-9 13,4 20,26 0,13 -20,26 -13,4 -31,-9 -9,-9"/></g>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a45b8"/>
      <stop offset="1" stop-color="#002b80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" rx="220" fill="url(#bg)"/>
  <!-- shield -->
  <path d="M600 190 L905 300 V600 C905 800 760 940 600 1010 C440 940 295 800 295 600 V300 Z" fill="#ffffff" opacity="0.10"/>
  <path d="M600 230 L865 326 V600 C865 775 738 900 600 964 C462 900 335 775 335 600 V326 Z" fill="none" stroke="#ffffff" stroke-width="34" stroke-linejoin="round"/>
  <!-- checkmark -->
  <path d="M455 615 L560 720 L750 470" fill="none" stroke="#ffed00" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffed00" transform="translate(600,600)">
