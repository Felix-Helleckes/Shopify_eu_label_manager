# Netlify configuration – EU Compliance Suite (React Router 7 on Netlify Functions)
[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/client/**", "node_modules/@prisma/client/**", "prisma/schema.prisma"]
